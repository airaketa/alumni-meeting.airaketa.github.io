<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Alumnee Meeting Countdown</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="badge">Встречаемся в 2031</div>
        <h1 class="title">Следующая встреча выпускников</h1>
        <p class="subtitle">
          Отсчет до последней субботы февраля &nbsp;2031
        </p>
      </header>

      <main class="main">
        <section class="card">
          <div class="photo-frame photo-frame-a"></div>
          <div class="photo-frame photo-frame-b"></div>
          <div class="photo-frame photo-frame-c"></div>
          <div class="photo-frame photo-frame-d"></div>
          <div class="photo-frame photo-frame-e"></div>
          <div class="photo-frame photo-frame-f"></div>
          <div class="photo-frame photo-frame-g"></div>
          <div class="clock-circle">
            <div class="clock-inner">
              <div class="countdown-label">До встречи осталось</div>
              <div class="countdown">
                <div class="time-segment">
                  <span id="years" class="time-value">--</span>
                  <span class="time-unit">YY</span>
                </div>
                <span class="colon">:</span>
                <div class="time-segment">
                  <span id="days" class="time-value">--</span>
                  <span class="time-unit">DD</span>
                </div>
                <span class="colon">:</span>
                <div class="time-segment">
                  <span id="hours" class="time-value">--</span>
                  <span class="time-unit">HH</span>
                </div>
                <span class="colon">:</span>
                <div class="time-segment">
                  <span id="minutes" class="time-value">--</span>
                  <span class="time-unit">MM</span>
                </div>
              </div>
            </div>
          </div>
          <p class="date-text" id="target-date-text"></p>
        </section>
      </main>

      <footer class="footer">
        <p class="footer-text">
          Get ready to meet your classmates again 🎓
        </p>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
  </html>
